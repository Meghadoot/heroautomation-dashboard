<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="60">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeroAutomation Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="container">

    <h1>⚔️ HeroAutomation Dashboard</h1>
    
    <div id="dashboardMeta"></div>

    <div id="summaryCards" class="summary-grid"></div>

    <h2>Account Status</h2>

    <table id="accountsTable">
        <thead>
            <tr>
                <th>Account</th>
                <th>Status</th>
                <th>Completion Signal</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

    <h2>Goodwin Action Matrix</h2>

<div class="table-wrapper">

<table id="actionsTable">
        <thead>
            <tr>
                <th>Action</th>
                <th>Enabled</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

    <h2>Quest Matrix</h2>

<div class="table-wrapper">

<table id="questsTable">
        <thead>
            <tr>
                <th>Quest</th>
                <th>Enabled</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

    <h2>Recent History</h2>

    <table id="historyTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Result</th>
                <th>Completed</th>
                <th>Failed</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
