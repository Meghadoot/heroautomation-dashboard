<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="60">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>HeroAutomation Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>HeroAutomation Dashboard</h1>
            <p class="page-subtitle">Multi-account execution and Goodwin profile overview</p>
        </header>

        <div id="dashboardMeta"></div>
        <div id="summaryCards" class="summary-grid"></div>

        <section class="dashboard-section">
            <h2>Account Status</h2>
            <div class="table-wrapper">
                <table id="accountsTable">
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th>Status</th>
                            <th>Completion Signal</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="dashboard-section">
            <h2>Goodwin Action Matrix</h2>
            <div class="table-wrapper">
                <table id="actionsTable">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="dashboard-section">
            <h2>Quest Matrix</h2>
            <div class="table-wrapper">
                <table id="questsTable">
                    <thead>
                        <tr>
                            <th>Quest</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="dashboard-section">
            <h2>Recent History</h2>
            <div class="table-wrapper">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Result</th>
                            <th>Completed</th>
                            <th>Failed</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
